[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Private.inc
@Include2=#@#ChromeProfile.inc

[MeasureClockTime]
Measure=Time
Format=%M%S

[MeasureClockAlignedRefresh]
Measure=Calc
Formula=[MeasureClockTime]
DynamicVariables=1
IfCondition=(MeasureClockAlignedRefresh % 1000) = 0
IfTrueAction=[!CommandMeasure MeasurePersonalCalendarFeed "Update"][!CommandMeasure MeasureHolidayCalendarFeed "Update"][!CommandMeasure WebView2 "Execute window.handleClockTick && window.handleClockTick()"]

[MeasurePersonalCalendarFeed]
Measure=WebParser
URL=#CalendarURL#
UpdateRate=600
Download=1
DownloadFile=personal.ics
Flags=ForceReload|NoCookies
FinishAction=[!CommandMeasure WebView2 "Execute window.markCalendarFeedSuccess && window.markCalendarFeedSuccess('personal'); window.reloadCalendar && window.reloadCalendar()"]
OnDownloadErrorAction=[!CommandMeasure WebView2 "Execute window.markCalendarFeedError && window.markCalendarFeedError('personal')"]

[MeasureHolidayCalendarFeed]
Measure=WebParser
URL=https://calendar.google.com/calendar/ical/ko.south_korea%23holiday%40group.v.calendar.google.com/public/basic.ics
UpdateRate=600
Download=1
DownloadFile=holidays.ics
Flags=ForceReload|NoCookies
FinishAction=[!CommandMeasure WebView2 "Execute window.markCalendarFeedSuccess && window.markCalendarFeedSuccess('holidays'); window.reloadCalendar && window.reloadCalendar()"]
OnDownloadErrorAction=[!CommandMeasure WebView2 "Execute window.markCalendarFeedError && window.markCalendarFeedError('holidays')"]

[MeasureOpenGoogleCalendar]
Measure=Plugin
Plugin=RunCommand
Program=""#ChromePath#""
Parameter=--profile-directory="#ChromeProfileDirectory#" --new-window "https://calendar.google.com/calendar/u/0/r?authuser=#GoogleAccount#"
State=Hide
DynamicVariables=1

[WebView2]
Measure=Plugin
Plugin=WebView2
HostSecurity=1
HostOrigin=0
HostPath=#CURRENTPATH#
URL=@Resources/calendar.html
X=0
Y=0
W=600
H=420
Clickthrough=2
ZoomFactor=1.0
ZoomControl=0
AssistiveFeatures=0
NewWindow=0

[Bounds]
Meter=Image
X=0
Y=0
W=600
H=420
SolidColor=0,0,0,1
