<!doctype html>
<html lang="ko" data-sync="idle">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로컬 캘린더</title>
    <link rel="stylesheet" href="./calendar.css">
    <script type="importmap">
      {
        "imports": {
          "ical.js": "./vendor/ical.js"
        }
      }
    </script>
    <script type="module" src="./calendar.js"></script>
  </head>
  <body>
    <main class="calendar-shell" aria-label="월간 일정">
      <header class="calendar-header">
        <button class="nav-button previous" id="previous-month" type="button" aria-label="이전 달"></button>
        <button class="today-button" id="today-button" type="button">오늘</button>
        <div class="month-heading">
          <h1 id="month-label"></h1>
          <p id="sync-state" role="status" aria-live="polite"></p>
        </div>
        <button class="settings-button" id="theme-settings-button" type="button"
          aria-label="색상 설정" aria-expanded="false" aria-controls="theme-settings-panel">
          <span class="settings-icon" aria-hidden="true"></span>
        </button>
        <button class="nav-button next" id="next-month" type="button" aria-label="다음 달"></button>
      </header>
      <section class="calendar-content" aria-labelledby="month-label">
        <div class="weekday-row" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="calendar-grid" class="calendar-grid" role="grid" aria-label="월간 일정표"></div>
      </section>
      <section class="theme-settings-panel" id="theme-settings-panel" role="dialog" aria-label="색상 설정" hidden>
        <div class="theme-field"><label for="theme-background-hex">배경색</label><span class="theme-color-controls"><input id="theme-background-hex" class="theme-hex" type="text" inputmode="text" maxlength="7" pattern="#[0-9A-Fa-f]{6}" spellcheck="false" aria-label="배경색 HEX 코드" value="#FFFFFF"><button id="theme-background" class="theme-swatch" type="button" value="#FFFFFF" aria-label="배경색 선택창 열기" aria-haspopup="dialog"></button></span></div>
        <div class="theme-field"><label for="theme-foreground-hex">글자색</label><span class="theme-color-controls"><input id="theme-foreground-hex" class="theme-hex" type="text" inputmode="text" maxlength="7" pattern="#[0-9A-Fa-f]{6}" spellcheck="false" aria-label="글자색 HEX 코드" value="#FFFFFF"><button id="theme-foreground" class="theme-swatch" type="button" value="#FFFFFF" aria-label="글자색 선택창 열기" aria-haspopup="dialog"></button></span></div>
        <label class="theme-opacity-field" for="theme-opacity">
          <span>배경 투명도</span>
          <output id="theme-opacity-value" for="theme-opacity">78%</output>
          <input id="theme-opacity" type="range" min="0" max="100" step="1" value="78">
        </label>
        <button class="theme-reset" id="theme-reset" type="button">초기화</button>
        <section id="color-picker" class="color-picker" role="dialog" aria-labelledby="picker-heading" hidden>
          <div class="picker-header"><span id="picker-heading">배경색</span><button id="picker-close" type="button" aria-label="색상 선택창 닫기">×</button></div>
          <div id="picker-palette" class="picker-palette" tabindex="0" role="group" aria-label="채도와 밝기 선택 · 방향키로 조절"><span id="picker-cursor" class="picker-cursor"></span></div>
          <div class="picker-toolbar">
            <button id="picker-eyedropper" type="button" aria-label="화면에서 색 추출" title="화면에서 색 추출"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M16 3l5 5-3 3-1-1-9 9-4 1 1-4 9-9-1-1z"/></svg></button>
            <span id="picker-preview" class="picker-preview" aria-hidden="true"></span>
            <input id="picker-hue" class="picker-hue" type="range" min="0" max="360" step="1" value="0" aria-label="색조">
          </div>
          <div class="picker-rgb">
            <label><input id="picker-r" type="number" min="0" max="255" step="1" aria-label="R 빨강">R</label>
            <label><input id="picker-g" type="number" min="0" max="255" step="1" aria-label="G 초록">G</label>
            <label><input id="picker-b" type="number" min="0" max="255" step="1" aria-label="B 파랑">B</label>
          </div>
          <p id="picker-status" class="picker-status" role="status" aria-live="polite"></p>
          <div id="picker-help" class="picker-help" role="alert" hidden>
            <strong>YourPicker가 필요합니다</strong>
            <p>화면 색 추출을 사용하려면 YourPicker를 설치한 뒤 달력을 새로고침하세요.</p>
            <button id="picker-install" type="button">설치 페이지 열기</button>
            <button id="picker-refresh" type="button">달력 새로고침</button>
            <button id="picker-help-dismiss" class="picker-help-dismiss" type="button">RGB 편집으로 돌아가기</button>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
