[Variables]
; Variables(변수) section(구역) allows Rainmeter to preserve settings on upgrade(업데이트 시 설정 보존).
; Enabled(사용 여부): 1 = on(켜기), 0 = off(끄기). Refresh the skin(스킨 새로고침) after editing.
Enabled=1
; Corner(호출 모서리): TopLeft(왼쪽 위), TopRight(오른쪽 위), BottomLeft(왼쪽 아래), BottomRight(오른쪽 아래).
Corner=TopLeft
; TriggerSize(감지 영역 크기): 1-32 physical pixels(실제 픽셀), on every monitor(각 모니터).
TriggerSize=6
; OpenDelayMs(열기 대기 시간), CloseDelayMs(닫기 대기 시간): 100-5000 milliseconds(밀리초).
OpenDelayMs=400
CloseDelayMs=600
; IdleMode(대기 상태): Desktop(바탕화면 표시), Hidden(완전히 숨김).
IdleMode=Desktop
; SuppressFullscreen(전체 화면 앱 사용 중 호출 차단): 1 = on(켜기), 0 = off(끄기).
SuppressFullscreen=1
